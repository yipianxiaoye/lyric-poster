name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'
  # Keep the package host consistent with the committed lockfile.
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --no-pub

  windows:
    name: Windows release artifact
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - name: Package portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'build/windows/x64/runner/Release'
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = ($versionLine -replace '^version:\s*', '').Trim().Split('+')[0]
          $bundle = Join-Path $PWD "dist/LyricPoster-$version-windows-x64"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Get-ChildItem -LiteralPath $release | Where-Object { $_.Extension -notin @('.pdb', '.lib', '.exp') } | Copy-Item -Destination $bundle -Recurse
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md -Destination $bundle
          Copy-Item assets/fonts/OFL.txt (Join-Path $bundle 'FONT-LICENSE.txt')
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Join-Path $vsPath 'VC/Redist/MSVC'
          $crt = Get-ChildItem -LiteralPath $redist -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' } |
            Sort-Object { [version]($_.Name) } -Descending |
            ForEach-Object { Get-ChildItem -LiteralPath (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crt) { throw 'Microsoft Visual C++ runtime DLLs were not found.' }
          Get-ChildItem -LiteralPath $crt.FullName -Filter '*.dll' | Copy-Item -Destination $bundle
          'Extract the entire ZIP and open lyric_poster.exe. Keep DLL files and data next to the executable. Microsoft Visual C++ Runtime DLLs copyright Microsoft Corporation.' | Set-Content (Join-Path $bundle 'README.txt')
          Compress-Archive -LiteralPath $bundle -DestinationPath "$bundle.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-poster-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android test artifact
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # No private release key is used in CI; this APK is for testing only.
      - run: flutter build apk --release --no-pub
        env:
          LYRIC_POSTER_ALLOW_DEBUG_SIGNING: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-poster-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
